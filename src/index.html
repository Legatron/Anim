<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ДЗ: Collapse Widget</title>
</head>
<body>
  <div class="widgets-container">
    <!-- Виджет -->
    <div class="collapse-widget">
      <button class="collapse-btn">Collapse</button>
      
      <!-- Сворачиваемый блок -->
      <div class="collapse-content">
        <div class="collapse-inner">
          <div class="text-container">
            <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Nisi nihil, obcaecati odit voluptatibus dolorem repellendus molestiae porro. Reiciendis neque voluptates iure culpa molestiae, fugiat asperiores quo dolor excepturi voluptatem et.</p>
          </div>
        </div>
      </div>

      <div class="copy-wrapper">
        <span class="copy-btn">Copy</span>
      </div>
    </div>
  </div>
</body>
</html>
